name: 朋友圈数据刷新
# 改 cron 后如果长时间看不到 schedule 运行，重新提交一次本文件可促使 GitHub
# 重新登记定时计划（调度器按仓库批量索引，偶尔会滞后很久）。

# 朋友圈唯一的采集通道（v4.4.4 起）：
#   每 5 分钟抓一次友链 Atom/RSS，有新文章才提交回 source/fcircle/moments.json，
#   提交触发 Netlify 部署，页面读到的就是更新的静态 JSON。
#
# 5 分钟是 GitHub Actions 定时任务的硬下限（官方不支持更短，写 "* * * * *" 也按 5 分钟跑）。
# v4.4.3 曾用 Netlify 定时函数做到每分钟，但那是 1440 次/天的函数调用与运行时，
# 换来的还是「几分钟后才看得到」的同一份数据，已被删除。**不要再把这层搬回 Netlify。**
#
# 本机不跑任何刷新任务；Netlify 构建期也不抓，只复制静态 JSON。
on:
  schedule:
    # 每 5 分钟（UTC）。想省额度：*/15 * * * * 或 0 * * * *。
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "触发原因（可选）"
        required: false
        default: "后台手动触发"

permissions:
  contents: write

# 不要 cancel-in-progress：5 分钟一轮，若某轮稍慢（抓取 60 秒 + 安装依赖），
# 新一轮会把正在提交的那轮掐掉，结果是「永远跑不完、数据永远不更新」。
# 排队执行更安全，最坏只是延后几分钟。
concurrency:
  group: fcircle-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 脚本与 workflow 都只用 js-yaml 这一个包，避免安装整套 Hexo 依赖
      - name: 安装 YAML 解析依赖
        run: npm install js-yaml@4 --no-save --no-package-lock --no-audit --no-fund --silent

      - name: 读取后台配置
        id: cfg
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const yaml = require("js-yaml");
          let c = {};
          try { c = yaml.load(fs.readFileSync("source/_data/fcircle.yml", "utf8")) || {}; } catch (e) {}
          const enabled = c.enabled === false ? "false" : "true";
          const perLink = Number(c.per_link) > 0 ? Math.min(Number(c.per_link), 20) : 5;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\nper_link=${perLink}\n`);
          console.log(`enabled=${enabled} per_link=${perLink}`);
          NODE

      - name: 抓取友链 Atom/RSS 并增量合并
        # 总开关只管定时任务；后台/页面手动触发始终执行
        if: steps.cfg.outputs.enabled == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          node .github/scripts/fcircle-refresh.mjs \
            --write \
            --per-link ${{ steps.cfg.outputs.per_link }} \
            --timeout 5000 \
            --concurrency 12 \
            --max-total 60000

      - name: 提交并推送数据
        run: |
          if git diff --quiet -- source/fcircle/moments.json .github/scripts/fcircle-feeds.json; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/fcircle/moments.json .github/scripts/fcircle-feeds.json
          git commit -m "chore(pyq): 自动刷新朋友圈数据"
          # 5 分钟一轮后，运行期间远端被别人（或上一轮）推进的概率显著上升，
          # 直接 push 容易 non-fast-forward。先 rebase 再推；冲突就放弃本次，
          # 数据下一轮会重新抓到，不会丢。
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git rebase "origin/${GITHUB_REF_NAME}"; then
            git rebase --abort || true
            echo "远端已前进且 rebase 冲突，放弃本次提交（下一轮会重抓）"
            exit 0
          fi
          git push
