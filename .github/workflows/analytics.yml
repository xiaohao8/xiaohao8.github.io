name: analytics

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时聚合一次
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 聚合统计数据
        run: node tools/aggregate-analytics.mjs

      - name: 有变化才提交（避免空构建）
        id: diff
        run: |
          git add source/analytics/stats.json analytics/stats.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交
        if: steps.diff.outputs.changed == 'true'
        run: |
          git -c user.name=analytics-bot -c user.email=actions@github.com commit \
            -m "chore(analytics): 更新站点统计数据"
          git push
