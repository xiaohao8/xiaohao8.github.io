backend:
  name: git-gateway
  branch: main
  squash_merges: true

local_backend: false
publish_mode: editorial_workflow

media_folder: "source/images/uploads"
public_folder: "/images/uploads"

locale: "zh_Hans"
site_url: "https://202271.xyz"
display_url: "https://202271.xyz"
logo_url: "https://202271.xyz/images/uploads/android-chrome-192x192.png"

collections:
  - name: "overview"
    label: "工作台"
    label_singular: "工作台"
    description: "站点内容概览与常用入口"
    files:
      - name: "dashboard"
        label: "内容概览"
        file: "source/_data/admin_overview.yml"
        editor:
          preview: false
        fields:
          - label: "后台工作台"
            name: "dashboard"
            widget: "qexo-dashboard"
            required: false
          - label: "数据版本"
            name: "version"
            widget: "hidden"
            default: 1

  - name: "posts"
    label: "文章"
    label_singular: "文章"
    description: "Hexo 文章，保存后进入编辑工作流"
    folder: "source/_posts"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}}"
    sortable_fields: ["date", "updated", "title", "sticky"]
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - label: "发布日期"
        name: "date"
        widget: "datetime"
        required: false
        format: "YYYY-MM-DD HH:mm:ss"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
      - label: "更新日期"
        name: "updated"
        widget: "datetime"
        required: false
        format: "YYYY-MM-DD HH:mm:ss"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
      - { label: "顶部图", name: "banner_img", widget: "image", required: false }
      - { label: "文章封面", name: "index_img", widget: "image", required: false }
      - label: "置顶权重"
        name: "sticky"
        widget: "number"
        required: false
        hint: "数值越大越靠前"
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "categories", widget: "list", required: false }
      - { label: "关键词", name: "keywords", widget: "list", required: false }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "永久链接", name: "permalink", widget: "string", required: false, hint: "留空时按 Hexo 的 abbrlink 规则生成" }
      - { label: "abbrlink", name: "abbrlink", widget: "string", required: false, hint: "旧文章的短链接标识，请勿随意修改" }
      - { label: "访问密码", name: "password", widget: "string", required: false, hint: "留空表示公开访问；设置后文章需要密码才能阅读" }
      - { label: "开启评论", name: "comments", widget: "boolean", default: true, required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "pages"
    label: "页面"
    label_singular: "页面"
    description: "关于、友链、说说、朋友圈和计划清单"
    files:
      - name: "about"
        label: "关于页"
        file: "source/about/index.md"
        fields:
          - { label: "布局", name: "layout", widget: "hidden", default: "about" }
          - { label: "标题", name: "title", widget: "string", default: "关于" }
          - { label: "副标题", name: "subtitle", widget: "string", required: false }
          - { label: "顶部图", name: "banner_img", widget: "image", required: false }
          - { label: "开启评论", name: "comments", widget: "boolean", default: false, required: false }
          - { label: "正文", name: "body", widget: "markdown", required: false }
      - name: "friends"
        label: "友链页"
        file: "source/friends.md"
        fields:
          - { label: "布局", name: "layout", widget: "hidden", default: "links" }
          - { label: "标题", name: "title", widget: "string", default: "友链" }
          - { label: "副标题", name: "subtitle", widget: "string", required: false }
          - { label: "顶部图", name: "banner_img", widget: "image", required: false }
          - { label: "开启评论", name: "comments", widget: "boolean", default: false, required: false }
      - name: "talks"
        label: "说说页"
        file: "source/talks.md"
        fields:
          - { label: "标题", name: "title", widget: "string", default: "说说" }
          - { label: "副标题", name: "subtitle", widget: "string", required: false }
          - { label: "顶部图", name: "banner_img", widget: "image", required: false }
          - { label: "开启评论", name: "comments", widget: "boolean", default: false, required: false }
          - { label: "正文", name: "body", widget: "markdown", required: false }
      - name: "pyq"
        label: "朋友圈页"
        file: "source/pyq/index.md"
        fields:
          - { label: "标题", name: "title", widget: "string", default: "朋友圈" }
          - { label: "副标题", name: "subtitle", widget: "string", required: false }
          - { label: "顶部图", name: "banner_img", widget: "image", required: false }
          - { label: "开启评论", name: "comments", widget: "boolean", default: true, required: false }
          - { label: "正文", name: "body", widget: "markdown", required: false }
      - name: "todolist"
        label: "计划清单"
        file: "source/todolist.md"
        fields:
          - { label: "标题", name: "title", widget: "string", default: "计划清单" }
          - { label: "副标题", name: "subtitle", widget: "string", required: false }
          - { label: "顶部图", name: "banner_img", widget: "image", required: false }
          - { label: "正文", name: "body", widget: "markdown", required: false }

  - name: "talks"
    label: "说说"
    label_singular: "说说"
    description: "短内容时间线，发布后自动展示在说说页"
    files:
      - name: "main"
        label: "说说列表"
        file: "source/_data/talks.yml"
        editor:
          preview: false
        fields:
          - label: "说说条目"
            name: "items"
            widget: "list"
            required: false
            collapsed: true
            fields:
              - label: "发布时间"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD HH:mm:ss"
                date_format: "YYYY-MM-DD"
                time_format: "HH:mm:ss"
                required: false
              - { label: "内容", name: "content", widget: "markdown" }
              - label: "配图"
                name: "images"
                widget: "list"
                required: false
                fields:
                  - { label: "图片", name: "image", widget: "image" }

  - name: "settings"
    label: "主题与友链"
    label_singular: "主题设置"
    description: "导航、首页、文章页、友链和页面横幅"
    files:
      - name: "fluid"
        label: "Fluid 主题设置"
        file: "source/_data/fluid_config.yml"
        editor:
          preview: false
        fields:
          - label: "导航栏"
            name: "navbar"
            widget: "object"
            collapsed: false
            fields:
              - { label: "博客名称", name: "blog_title", widget: "string", required: false }
              - label: "毛玻璃效果"
                name: "ground_glass"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "启用", name: "enable", widget: "boolean", default: true }
                  - { label: "模糊像素", name: "px", widget: "number", required: false }
                  - { label: "透明度", name: "alpha", widget: "number", required: false, hint: "0 - 1.0" }
              - label: "导航菜单"
                name: "menu"
                widget: "list"
                required: false
                collapsed: true
                summary: "{{fields.name}} → {{fields.link}}"
                fields:
                  - { label: "标识", name: "key", widget: "string", required: true }
                  - { label: "显示名称", name: "name", widget: "string", required: false, hint: "留空时使用主题语言包中的标识" }
                  - { label: "链接", name: "link", widget: "string", required: true }
                  - { label: "图标类名", name: "icon", widget: "string", default: "iconfont icon-link-fill", required: false }
          - label: "首页"
            name: "index"
            widget: "object"
            collapsed: true
            fields:
              - { label: "顶部图", name: "banner_img", widget: "image", required: false }
              - { label: "横幅高度", name: "banner_img_height", widget: "number", required: false }
              - label: "副标题"
                name: "slogan"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "文字", name: "text", widget: "string", required: false }
          - label: "文章页"
            name: "post"
            widget: "object"
            collapsed: true
            fields:
              - { label: "顶部图", name: "banner_img", widget: "image", required: false }
              - { label: "横幅高度", name: "banner_img_height", widget: "number", required: false }
              - { label: "默认封面", name: "default_index_img", widget: "image", required: false }
          - label: "归档页"
            name: "archive"
            widget: "object"
            collapsed: true
            fields:
              - { label: "顶部图", name: "banner_img", widget: "image", required: false }
              - { label: "横幅高度", name: "banner_img_height", widget: "number", required: false }
              - { label: "副标题", name: "subtitle", widget: "string", required: false }
          - label: "分类页"
            name: "category"
            widget: "object"
            collapsed: true
            fields:
              - { label: "顶部图", name: "banner_img", widget: "image", required: false }
              - { label: "横幅高度", name: "banner_img_height", widget: "number", required: false }
              - { label: "副标题", name: "subtitle", widget: "string", required: false }
          - label: "标签页"
            name: "tag"
            widget: "object"
            collapsed: true
            fields:
              - { label: "顶部图", name: "banner_img", widget: "image", required: false }
              - { label: "横幅高度", name: "banner_img_height", widget: "number", required: false }
              - { label: "副标题", name: "subtitle", widget: "string", required: false }
          - label: "关于页"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "顶部图", name: "banner_img", widget: "image", required: false }
              - { label: "横幅高度", name: "banner_img_height", widget: "number", required: false }
              - { label: "副标题", name: "subtitle", widget: "string", required: false }
              - { label: "头像", name: "avatar", widget: "image", required: false }
              - { label: "博客名称", name: "name", widget: "string", required: false }
              - { label: "个人简介", name: "intro", widget: "string", required: false }
          - label: "友链页"
            name: "links"
            widget: "object"
            collapsed: false
            fields:
              - { label: "标题", name: "title", widget: "string", required: false }
              - { label: "副标题", name: "subtitle", widget: "string", required: false }
              - { label: "顶部图", name: "banner_img", widget: "image", required: false }
              - { label: "横幅高度", name: "banner_img_height", widget: "number", required: false }
              - { label: "头像加载失败占位图", name: "onerror_avatar", widget: "image", required: false }
              - label: "友链成员"
                name: "items"
                widget: "list"
                required: false
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - { label: "站点名称", name: "title", widget: "string", required: true }
                  - { label: "站点简介", name: "intro", widget: "string", required: false }
                  - { label: "站点地址", name: "link", widget: "string", required: true }
                  - { label: "站点头像", name: "avatar", widget: "image", required: false }
              - label: "友链页提示"
                name: "custom"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "启用", name: "enable", widget: "boolean", default: true }
                  - { label: "HTML 内容", name: "content", widget: "text", required: false }

  - name: "site"
    label: "站点资料"
    label_singular: "站点资料"
    description: "构建时覆盖站点标题、副标题、描述和作者信息"
    files:
      - name: "meta"
        label: "基础资料"
        file: "source/_data/site_meta.yml"
        editor:
          preview: false
        fields:
          - { label: "站点标题", name: "title", widget: "string" }
          - { label: "副标题", name: "subtitle", widget: "string", required: false }
          - { label: "站点描述", name: "description", widget: "text", required: false }
          - { label: "关键词", name: "keywords", widget: "string", required: false, hint: "多个关键词用英文逗号分隔" }
          - { label: "作者", name: "author", widget: "string", required: false }
          - { label: "语言", name: "language", widget: "string", default: "zh-CN" }
