[build]
  publish = "public"
  # 每次部署自动刷新朋友圈：先从本站友链抓 Atom/RSS 增量合并进
  # source/fcircle/moments.json，再 hexo generate 复制成静态 /fcircle/moments.json。
  # 后台改友链也会触发部署，因此新友链会被自动抓取，无需人工干预。
  # 用 ; 而不是 &&：抓取失败或超时也必须继续构建，页面会回退到入库基线数据。
  # 工具自带 --max-total 总时限与「0 feed 不覆盖」保护，不会拖垮构建。
  command = "node tools/fcircle-refresh.mjs --write --timeout 4000 --concurrency 12 --max-total 45000; npm run build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/admin/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/assets/*"
  [headers.values]
    # 模块走短强缓存 + 后台异步刷新：切页时直接命中本地缓存，不再为每个模块发一次 304。
    # 入口 app.js?v=VERSION 在大版本更新时换 URL，会立即拉新代码；
    # 无版本号的静态依赖靠 SWR 更新（最多滞后一次导航，不会再出现发布后卡旧版 1 小时）。
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 构建期文章索引：每次部署内容都会变，不能让 CDN 缓存旧列表
[[headers]]
  for = "/admin/posts-index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 本地朋友圈数据每次部署都会变，别让 CDN 缓存旧列表
[[headers]]
  for = "/fcircle/moments.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/talks"
  to = "/talks.html"
  status = 200

[[redirects]]
  from = "/talks/"
  to = "/talks.html"
  status = 200

[[redirects]]
  from = "/friends"
  to = "/friends.html"
  status = 200

[[redirects]]
  from = "/friends/"
  to = "/friends.html"
  status = 200

# 旧友链地址与历史书签 → 统一友链页
[[redirects]]
  from = "/links"
  to = "/friends/"
  status = 301

[[redirects]]
  from = "/links/"
  to = "/friends/"
  status = 301

# 朋友圈数据已本地化为 /fcircle/moments.json，运行时不请求任何外部接口。
