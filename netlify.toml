[build]
  publish = "public"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/admin/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/assets/*"
  [headers.values]
    # 模块走短强缓存 + 后台异步刷新：切页时直接命中本地缓存，不再为每个模块发一次 304。
    # 入口 app.js?v=VERSION 在大版本更新时换 URL，会立即拉新代码；
    # 无版本号的静态依赖靠 SWR 更新（最多滞后一次导航，不会再出现发布后卡旧版 1 小时）。
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 构建期文章索引：每次部署内容都会变，不能让 CDN 缓存旧列表
[[headers]]
  for = "/admin/posts-index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 构建期朋友圈快照每次部署都会变，别让 CDN 缓存旧列表
[[headers]]
  for = "/fcircle/moments.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/talks"
  to = "/talks.html"
  status = 200

[[redirects]]
  from = "/talks/"
  to = "/talks.html"
  status = 200

[[redirects]]
  from = "/friends"
  to = "/friends.html"
  status = 200

[[redirects]]
  from = "/friends/"
  to = "/friends.html"
  status = 200

# 旧友链地址与历史书签 → 统一友链页
[[redirects]]
  from = "/links"
  to = "/friends/"
  status = 301

[[redirects]]
  from = "/links/"
  to = "/friends/"
  status = 301

# 朋友圈数据源：blog.anheyu.com 的 /api/pro/moments 不返回 CORS 头，
# OPTIONS 预检 403，浏览器无法跨域直连。用 200 反代把外部接口变成同源路径，
# query（page / page_size / sort_type）由 Netlify 透传给目标。
# 反代不可用时 /fcircle/moments.json（构建期快照）保证页面仍有内容。
[[redirects]]
  from = "/fcircle/api/moments"
  to = "https://blog.anheyu.com/api/pro/moments"
  status = 200

[[redirects]]
  from = "/fcircle/api/randompost"
  to = "https://blog.anheyu.com/api/pro/moments/randompost"
  status = 200
