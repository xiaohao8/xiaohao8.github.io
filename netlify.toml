[build]
  publish = "public"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 11MB 离线 IPv4 归属库（省 / 市 / 运营商）只给采集函数打包。
# 之前放在全局 [functions] 里，聚合函数 /api/stats 也白白背了 11MB，冷启动明显变慢。
# Netlify 允许按函数名配置 included_files；查询完全在本地，不调用任何第三方 IP 接口。
[functions.collect]
  included_files = ["netlify/data/*.xdb"]

# 朋友圈实时刷新：每分钟探测一次友链 RSS，增量写 Netlify Blobs。
# GitHub Actions 的 schedule 最小间隔是 5 分钟，做不到 1 分钟，所以高频这一层放在 Netlify；
# Actions 保留为「每天一次全量对齐 + 把基线提交进仓库」的兜底通道。
#
# 想降负载不用改 cron，设环境变量即可（函数内已读取）：
#   FCIRCLE_INTERVAL_SEC=180   改成 3 分钟一轮
#   FCIRCLE_SITE_INTERVAL_SEC=300  单个站点 5 分钟才探测一次
# 想彻底停掉：删掉下面这行 schedule 并重新部署。
# 注意：函数里也写了同样的 schedule（export const config），两处必须一致。
[functions."fcircle-tick"]
  schedule = "* * * * *"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/admin/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/assets/*"
  [headers.values]
    # 模块走短强缓存 + 后台异步刷新：切页时直接命中本地缓存，不再为每个模块发一次 304。
    # 入口 app.js?v=VERSION 在大版本更新时换 URL，会立即拉新代码；
    # 无版本号的静态依赖靠 SWR 更新（最多滞后一次导航，不会再出现发布后卡旧版 1 小时）。
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 构建期文章索引：每次部署内容都会变，不能让 CDN 缓存旧列表
[[headers]]
  for = "/admin/posts-index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# optimize-speed.js 给这三个 CSS 加了内容 hash 的 ?v=，内容变 URL 才变，
# 可以放心永久缓存；其余 /css/*、/js/* 仍是 1 小时，避免无版本号文件被锁死。
[[headers]]
  for = "/css/main.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/fonts.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/custom.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/fluid-bundle.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 本地朋友圈数据每次部署都会变，别让 CDN 缓存旧列表
[[headers]]
  for = "/fcircle/moments.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# 友链清单只在部署时变，实时刷新函数每分钟读一次，60 秒缓存刚好
[[headers]]
  for = "/fcircle/links.json"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"
    X-Content-Type-Options = "nosniff"

# 采集开关由后台写入仓库。这份配置只有几百字节，却是每个页面都要读的，
# 每次强制回源在跨境链路上白搭一个 RTT；短缓存 + SWR 最多滞后 60 秒，可接受。
[[headers]]
  for = "/analytics/config.json"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/talks"
  to = "/talks.html"
  status = 200

[[redirects]]
  from = "/talks/"
  to = "/talks.html"
  status = 200

[[redirects]]
  from = "/friends"
  to = "/friends.html"
  status = 200

[[redirects]]
  from = "/friends/"
  to = "/friends.html"
  status = 200

# 旧友链地址与历史书签 → 统一友链页
[[redirects]]
  from = "/links"
  to = "/friends/"
  status = 301

[[redirects]]
  from = "/links/"
  to = "/friends/"
  status = 301

# 朋友圈数据已本地化为 /fcircle/moments.json，运行时不请求任何外部接口。
